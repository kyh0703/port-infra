[general]
static=yes
writeprotect=no

[default]
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Registered PJSUA customer (1001) and operator (1002).
exten => _100[12],1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Read four RFC 4733 digits without depending on installed sound prompts.
exten => 601,1,Answer()
 same => n,Read(PJSUA_DIGITS,,4,,1,10)
 same => n,NoOp(PJSUA_DTMF_RESULT=${PJSUA_DIGITS})
 same => n,Echo()
 same => n,Hangup()

; 8 + number sends a local call toward LiveKit SIP.
exten => _8X.,1,NoOp(Local route to LiveKit SIP: ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@livekit,30)
 same => n,Hangup()

[from-livekit]
exten => _100[12],1,Goto(default,${EXTEN},1)
exten => _X.,1,NoOp(LiveKit SIP inbound ${EXTEN})
 same => n,Goto(default,600,1)
