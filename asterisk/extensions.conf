[general]
static=yes
writeprotect=no

[default]
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; 8 + number sends a local call toward LiveKit SIP.
exten => _8X.,1,NoOp(Local route to LiveKit SIP: ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@livekit,30)
 same => n,Hangup()

[from-livekit]
exten => _X.,1,NoOp(LiveKit SIP inbound ${EXTEN})
 same => n,Goto(default,600,1)
