services:
  api:
    image: port-api-dev-runtime:local
    build:
      context: ../api
      target: deps
    command: ["sh", "-lc", "pnpm install --store-dir /pnpm/store --frozen-lockfile && exec pnpm dev"]
    environment:
      NODE_ENV: development
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../api:/app
      - api_node_modules:/app/node_modules
      - api_pnpm_store:/pnpm/store
      - voice_preview_cache_dev:/app/data/voice-previews

  web:
    image: port-web-dev-runtime:local
    build:
      context: ../web
      target: deps
    command: ["sh", "-lc", "pnpm install --store-dir /pnpm/store --frozen-lockfile && exec pnpm dev"]
    environment:
      NODE_ENV: development
      CI: "true"
      HOSTNAME: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
      - web_pnpm_store:/pnpm/store
      - web_next_cache:/app/.next

volumes:
  api_node_modules:
  web_node_modules:
  api_pnpm_store:
  web_pnpm_store:
  web_next_cache:
  voice_preview_cache_dev:
