services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-port}
      POSTGRES_USER: ${POSTGRES_USER:-port}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-port_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0", "--redis-host", "redis:6379"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"

  livekit-sip:
    image: livekit/sip:v1.7.0
    profiles: ["telephony"]
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_URL: ws://livekit:7880
      REDIS_ADDRESS: redis:6379
    command: ["--config", "/etc/livekit-sip.yaml"]
    volumes:
      - ./livekit/sip.yaml:/etc/livekit-sip.yaml:ro
    ports:
      - "127.0.0.1:${LIVEKIT_SIP_HEALTH_PORT:-18090}:8080/tcp"
      - "127.0.0.1:${LIVEKIT_SIP_PORT:-15090}:5060/udp"
      - "127.0.0.1:${LIVEKIT_SIP_RTP_PORT:-15000}-${LIVEKIT_SIP_RTP_END_PORT:-15009}:10000-10009/udp"
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET / HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r _ status _ <&3
          test "$$status" = 200
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  asterisk:
    image: andrius/asterisk:22-alpine
    profiles: ["telephony"]
    restart: unless-stopped
    depends_on:
      livekit-sip:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ASTERISK_SIP_PORT:-15060}:5060/udp"
      - "127.0.0.1:${ASTERISK_RTP_PORT:-15100}-${ASTERISK_RTP_END_PORT:-15109}:10000-10009/udp"
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./asterisk/modules.conf:/etc/asterisk/modules.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'pjsip show endpoint livekit' | grep -q 'Endpoint:  livekit'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  livekit-cli:
    image: livekit/livekit-cli:v2.16.3
    profiles: ["telephony"]
    restart: "no"
    depends_on:
      livekit:
        condition: service_started
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    volumes:
      - ./sip:/sip:ro

  api:
    image: ghcr.io/kyh0703/port-api:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag:
        condition: service_started
      api-migrator:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    env_file:
      - ${API_ENV_FILE:-./config/api.env.example}
    extra_hosts:
      - "macbookpro:host-gateway"
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
      - "${API_GRPC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgres-app-init:
    image: pgvector/pgvector:pg17
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-port_local_password}
      POSTGRES_USER: ${POSTGRES_USER:-port}
      POSTGRES_DB: ${POSTGRES_DB:-port}
    volumes:
      - ./postgres/init/01-ensure-port-user.sh:/usr/local/bin/ensure-port-user:ro
    command: ["sh", "/usr/local/bin/ensure-port-user"]

  api-migrator:
    image: ghcr.io/kyh0703/port-api:migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app-init:
        condition: service_completed_successfully
    env_file:
      - ${API_ENV_FILE:-./config/api.env.example}
    extra_hosts:
      - "macbookpro:host-gateway"
      - "host.docker.internal:host-gateway"

  web:
    image: ghcr.io/kyh0703/port-web:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${WEB_ENV_FILE:-./config/web.env.example}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  rag:
    image: ghcr.io/kyh0703/port-rag:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rag-migrator:
        condition: service_completed_successfully
    env_file:
      - ${RAG_ENV_FILE:-./config/rag.env.example}
    ports:
      - "${RAG_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  rag-migrator:
    image: ghcr.io/kyh0703/port-rag:dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app-init:
        condition: service_completed_successfully
    env_file:
      - ${RAG_ENV_FILE:-./config/rag.env.example}
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]

  voice-agent:
    image: ghcr.io/kyh0703/port-voice-agent:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      livekit:
        condition: service_started
      rag:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${VOICE_AGENT_ENV_FILE:-./config/voice-agent.env.example}
    extra_hosts:
      - "macbookpro:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ${VOICE_AGENT_CONFIG_FILE:-./config/voice-agent.local.example.yaml}:/app/config/local.yaml:ro
    ports:
      - "${VOICE_AGENT_METRICS_PORT:-19091}:9091"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9091/metrics').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  aggregator:
    image: ghcr.io/kyh0703/port-aggregator:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ${AGGREGATOR_ENV_FILE:-./config/aggregator.env.example}
    ports:
      - "${AGGREGATOR_PORT:-3001}:3000"
  adaptor:
    image: ghcr.io/kyh0703/port-adaptor:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file:
      - ${ADAPTOR_ENV_FILE:-./config/adaptor.env.example}
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: ${PROMETHEUS_CPU_LIMIT:-0.5}
          memory: ${PROMETHEUS_MEMORY_LIMIT:-512M}

  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: ${GRAFANA_CPU_LIMIT:-0.5}
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  prometheus_data:
  grafana_data:
