services:
  ghost:
    image: ghost:6-alpine
    # Keep repository-mounted theme/routes read-only; skip root entrypoint chown.
    user: node
    profiles: ["blog"]
    restart: unless-stopped
    depends_on:
      ghost-db:
        condition: service_healthy
      ghost-content-init:
        condition: service_completed_successfully
    ports:
      - "${GHOST_BIND_HOST:-127.0.0.1}:${GHOST_PORT:-2368}:2368"
    environment:
      NODE_ENV: production
      url: ${GHOST_URL:-http://localhost:2368}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD:-ghost_local_password}
      database__connection__database: ghost
    volumes:
      - ghost_content:/var/lib/ghost/content
      - type: bind
        source: ./ghost/theme/tello
        target: /var/lib/ghost/content/themes/tello
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ghost/theme/routes.yaml
        target: /var/lib/ghost/content/settings/routes.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - ghost_internal
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2368/ghost/api/admin/site/', {redirect: 'manual'}).then(r => process.exit(r.status === 200 || r.status === 301 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  ghost-content-init:
    image: ghost:6-alpine
    profiles: ["blog"]
    restart: "no"
    user: root
    entrypoint: ["sh", "-c"]
    # Precreate bind parents before Docker can create them as root at Ghost start.
    command: ["mkdir -p /var/lib/ghost/content/themes /var/lib/ghost/content/settings && chown -R node:node /var/lib/ghost/content"]
    volumes:
      - ghost_content:/var/lib/ghost/content

  ghost-db:
    image: mysql:8.0
    profiles: ["blog"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD:-ghost_local_password}
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_ROOT_PASSWORD:-ghost_local_root_password}
    volumes:
      - ghost_db_data:/var/lib/mysql
    networks:
      - ghost_internal
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-port}
      POSTGRES_USER: ${POSTGRES_USER:-port}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-port_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/kyh0703/port-api:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag:
        condition: service_started
      api-migrator:
        condition: service_completed_successfully
    env_file:
      - ${API_ENV_FILE:-./config/api.local.env}
    environment:
      INTERNAL_SERVER_KEY: ${INTERNAL_SERVER_KEY:?Set INTERNAL_SERVER_KEY in .env}
      API_TRUSTED_PROXY_CIDRS: 172.30.40.2/32
      OPENBAO_ADDR: https://openbao:8200
      OPENBAO_CA_CERT_FILE: /run/openbao-ca/ca.crt
      OPENBAO_ROLE_ID_FILE: /run/openbao/api-role-id
      OPENBAO_SECRET_ID_FILE: /run/openbao/api-secret-id
      VOICE_PREVIEW_CACHE_DIR: /app/data/voice-previews
    extra_hosts:
      - "macbookpro:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - openbao_api_credentials:/run/openbao:ro
      - ./data/openbao/tls/ca.crt:/run/openbao-ca/ca.crt:ro
      - voice_preview_cache:/app/data/voice-previews
    networks:
      default:
      secrets_internal:
      ingress:
        ipv4_address: 172.30.40.3
    ports:
      - "127.0.0.1:${API_GRPC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgres-app-init:
    image: pgvector/pgvector:pg17
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-port_local_password}
      POSTGRES_USER: ${POSTGRES_USER:-port}
      POSTGRES_DB: ${POSTGRES_DB:-port}
    volumes:
      - ./postgres/init/01-ensure-port-user.sh:/usr/local/bin/ensure-port-user:ro
    command: ["sh", "/usr/local/bin/ensure-port-user"]

  api-migrator:
    image: ghcr.io/kyh0703/port-api:migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app-init:
        condition: service_completed_successfully
    env_file:
      - ${API_ENV_FILE:-./config/api.local.env}
    environment:
      INTERNAL_SERVER_KEY: ${INTERNAL_SERVER_KEY:?Set INTERNAL_SERVER_KEY in .env}
      OPENBAO_ADDR: https://openbao:8200
      OPENBAO_CA_CERT_FILE: /run/openbao-ca/ca.crt
      OPENBAO_ROLE_ID_FILE: /run/openbao/api-role-id
      OPENBAO_SECRET_ID_FILE: /run/openbao/api-secret-id
    extra_hosts:
      - "macbookpro:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - openbao_api_credentials:/run/openbao:ro
      - ./data/openbao/tls/ca.crt:/run/openbao-ca/ca.crt:ro
    networks:
      - default
      - secrets_internal

  web:
    image: ghcr.io/kyh0703/port-web:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ${WEB_ENV_FILE:-./config/web.env.example}
    networks:
      default:
      ingress:
        ipv4_address: 172.30.40.4
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ingress:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      INGRESS_PUBLIC_AUTHORITY: ${INGRESS_PUBLIC_AUTHORITY:?Set INGRESS_PUBLIC_AUTHORITY to the canonical HTTPS host:port}
      INGRESS_TRUSTED_EDGE_CIDR: 172.30.40.1/32
    ports:
      - "127.0.0.1:${INGRESS_PORT:-8088}:8088"
    volumes:
      - type: bind
        source: ./ingress/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    networks:
      ingress:
        ipv4_address: 172.30.40.2
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/api/v1/health && wget -q -O /dev/null http://127.0.0.1:8088/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  rag:
    image: ghcr.io/kyh0703/port-rag:dev
    restart: unless-stopped
    depends_on:
      openbao:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rag-migrator:
        condition: service_completed_successfully
    env_file:
      - ${RAG_ENV_FILE:-./config/rag.env.example}
    environment:
      INTERNAL_SERVER_KEY: ${INTERNAL_SERVER_KEY:?Set INTERNAL_SERVER_KEY in .env}
      TMPDIR: /dev/shm
      OPENBAO_ADDR: https://openbao:8200
      OPENBAO_CA_CERT_FILE: /run/openbao-ca/ca.crt
      OPENBAO_ROLE_ID_FILE: /run/openbao/rag-role-id
      OPENBAO_SECRET_ID_FILE: /run/openbao/rag-secret-id
    shm_size: 1gb
    volumes:
      - openbao_rag_credentials:/run/openbao:ro
      - ./data/openbao/tls/ca.crt:/run/openbao-ca/ca.crt:ro
    networks:
      - default
      - secrets_internal
    ports:
      - "${RAG_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  rag-migrator:
    image: ghcr.io/kyh0703/port-rag:dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app-init:
        condition: service_completed_successfully
    env_file:
      - ${RAG_ENV_FILE:-./config/rag.env.example}
    environment:
      INTERNAL_SERVER_KEY: ${INTERNAL_SERVER_KEY:?Set INTERNAL_SERVER_KEY in .env}
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]

  voice-agent:
    image: ghcr.io/kyh0703/port-voice-agent:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      rag:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${VOICE_AGENT_ENV_FILE:-./config/voice-agent.local.env}
    environment:
      INTERNAL_SERVER_KEY: ${INTERNAL_SERVER_KEY:?Set INTERNAL_SERVER_KEY in .env}
    extra_hosts:
      - "macbookpro:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ${VOICE_AGENT_CONFIG_FILE:-./config/voice-agent.local.example.yaml}:/app/config/local.yaml:ro
    ports:
      - "${VOICE_AGENT_METRICS_PORT:-19091}:9091"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  aggregator:
    image: ghcr.io/kyh0703/port-aggregator:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-app-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ${AGGREGATOR_ENV_FILE:-./config/aggregator.env.example}
    ports:
      - "${AGGREGATOR_PORT:-3001}:3000"
  adaptor-api-tls:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        ca_dir=/data/caddy/pki/authorities/local
        ready=/data/adaptor-ca-ready
        rm -f "$$ready"
        caddy reverse-proxy \
          --from https://adaptor-api-tls \
          --to http://api:8000 \
          --internal-certs \
          --disable-redirects &
        caddy_pid=$$!
        trap 'kill -TERM "$$caddy_pid"; wait "$$caddy_pid"' TERM INT
        until [ -s "$$ca_dir/root.crt" ]; do
          kill -0 "$$caddy_pid"
          sleep 1
        done
        chmod 0755 /data/caddy /data/caddy/pki /data/caddy/pki/authorities "$$ca_dir"
        chmod 0644 "$$ca_dir/root.crt"
        touch "$$ready"
        wait "$$caddy_pid"
    volumes:
      - adaptor_api_tls:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/adaptor-ca-ready && wget --no-check-certificate -q -O /dev/null https://adaptor-api-tls/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  adaptor:
    image: ghcr.io/kyh0703/port-adaptor:dev
    restart: unless-stopped
    depends_on:
      adaptor-api-tls:
        condition: service_healthy
    env_file:
      - ${ADAPTOR_ENV_FILE:-./config/adaptor.env.example}
    volumes:
      - adaptor_api_tls:/run/caddy:ro
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  openbao:
    image: ghcr.io/openbao/openbao:2.6.2
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/usr/local/bin/openbao-entrypoint"]
    command: ["server", "-config=/bao/config/openbao.hcl"]
    environment:
      BAO_ADDR: https://openbao:8200
      BAO_CACERT: /bao/tls-runtime/ca.crt
      OPENBAO_SEAL_MODE: ${OPENBAO_SEAL_MODE:-shamir}
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-18200}:8200"
    expose:
      - "8200"
    volumes:
      - openbao_data:/bao/data
      - openbao_audit:/bao/audit
      - ${OPENBAO_SNAPSHOT_DIR:-./data/openbao/snapshots}:/bao/snapshots
      - ./openbao/config.hcl:/bao/config/openbao.hcl:ro
      - ./openbao/seal-static.hcl:/bao/config/seal-static.hcl:ro
      - ./openbao/entrypoint.sh:/usr/local/bin/openbao-entrypoint:ro
      - ./data/openbao/tls/ca.crt:/bao/tls/ca.crt:ro
      - ./data/openbao/tls/server.crt:/bao/tls/server.crt:ro
      - ./data/openbao/tls/server.key:/bao/tls/server.key:ro
    tmpfs:
      - /bao/tls-runtime
      - /bao/seal-runtime
    networks:
      - secrets_internal
      - openbao_host
    healthcheck:
      test: ["CMD-SHELL", "rc=0; bao status -format=json >/dev/null 2>&1 || rc=$$?; test $$rc -eq 0 -o $$rc -eq 2"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: ${PROMETHEUS_CPU_LIMIT:-0.5}
          memory: ${PROMETHEUS_MEMORY_LIMIT:-512M}

  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: ${GRAFANA_CPU_LIMIT:-0.5}
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}

volumes:
  ghost_content:
  ghost_db_data:
  postgres_data:
  pgadmin_data:
  redis_data:
  prometheus_data:
  grafana_data:
  openbao_data:
  openbao_audit:
  openbao_api_credentials:
  openbao_rag_credentials:
  voice_preview_cache:
  adaptor_api_tls:

networks:
  ghost_internal:
    internal: true
  secrets_internal:
    internal: true
  openbao_host:
  ingress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.40.0/24
          gateway: 172.30.40.1
