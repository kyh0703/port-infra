global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: rag
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: voice-agent
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: aggregator
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
