global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: rag
    static_configs:
      - targets: ["rag:8000"]

  - job_name: voice-agent
    static_configs:
      - targets: ["voice-agent:9091"]

  - job_name: aggregator
    static_configs:
      - targets: ["aggregator:3000"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
