# Append after each service's existing release overlays; keep the current images.
# OpenRouter credentials stay in the API's existing encrypted provider store.
x-jev-voicemail: &jev-voicemail
  JEV_VOICEMAIL_ENABLED: "true"
  JEV_ENDPOINTING_ENABLED: "false"
  JEV_ALLOWED_PUBLISHED_IDS: "${JEV_ALLOWED_PUBLISHED_IDS:?Set explicit voicemail publication IDs}"

services:
  api:
    environment:
      <<: *jev-voicemail
      JEV_DECISION_TIMEOUT_MS: "400"
  voice-agent:
    environment:
      <<: *jev-voicemail
      JEV_DECISION_TIMEOUT_MS: "600"
