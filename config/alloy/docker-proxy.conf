# The proxy retains privileged socket access. Never publish its port.
# Discovery, inspect (required by the log reader), and logs only; no exec or archive.
user root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    upstream docker { server unix:/var/run/docker.sock; }
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 2375;
        location ~ ^(/v[0-9]+\.[0-9]+)?/(_ping|version|networks|containers/json|containers/[a-f0-9]+/(logs|json))$ {
            limit_except GET { deny all; }
            proxy_pass http://docker;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
        location / { return 403; }
    }
}
